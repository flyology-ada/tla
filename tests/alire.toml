name = "flyology_tla_tests"
description = "Tests for the Flyology TLA+ conformance harness"
version = "0.1.0-dev"

authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "MIT OR Apache-2.0"
tags = ["testing"]
project-files = ["flyology_tla_tests.gpr"]
executables = ["flyology-tla-tests", "flyology-tla-command-line-probe"]

[[depends-on]]
flyology_tla = "*"

[[pins]]
flyology_tla = { path = ".." }

[build-switches]
"*" = { Compile_Checks = "warnings" }
